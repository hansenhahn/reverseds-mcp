[project]
name = "re-mcp"
version = "0.1.0"
description = "MCP de engenharia reversa assistida para o melonDS"
requires-python = ">=3.14"
dependencies = [
    "capstone>=5",
    "mcp>=1.0",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/re_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
