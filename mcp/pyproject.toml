[project]
name = "re-mcp"
version = "0.1.0"
description = "MCP de engenharia reversa assistida para o melonDS"
requires-python = ">=3.14"
dependencies = [
    "capstone>=5",
    "mcp>=1.0",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/re_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "re_mcp"

[[tool.importlinter.contracts]]
name = "domain é puro (não depende de application/infra/tools/bridge)"
type = "forbidden"
source_modules = ["re_mcp.domain"]
forbidden_modules = [
    "re_mcp.application",
    "re_mcp.infra",
    "re_mcp.tools",
    "re_mcp.bridge",
]

[[tool.importlinter.contracts]]
name = "application não depende de infra/tools/bridge"
type = "forbidden"
source_modules = ["re_mcp.application"]
forbidden_modules = ["re_mcp.infra", "re_mcp.tools", "re_mcp.bridge"]

[[tool.importlinter.contracts]]
name = "infra não depende de tools/bridge"
type = "forbidden"
source_modules = ["re_mcp.infra"]
forbidden_modules = ["re_mcp.tools", "re_mcp.bridge"]
