# Sobe o MCP re-mcp como servidor de rede (streamable-http), para o agente
# conectar sem o cliente precisar dar spawn (deploy manual).
#
# Pré-requisitos:
#   - melonDS rodando com o canal de controle (Socket configurado no melonDS)
#
# A ROM vem do emulador pelo canal de controle (`rom.info`/`rom.read`); não há
# bind-mount nem caminho fixo de ROM.
#
# `network_mode: host` é necessário para o gdb alcançar o stub em 127.0.0.1:3333
# (dentro do contêiner, 127.0.0.1 seria o próprio contêiner) e para o servidor
# HTTP ficar acessível no loopback do host.
services:
  re-mcp:
    build: .
    image: re-mcp
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${MELONDS_DIR:-/home/diego-hahn/melonds}:/run/melonds
      - ${OUT_DIR:-/home/diego-hahn/re_mcp_out}:/out
    environment:
      RE_MCP_CONTROL_SOCKET: /run/melonds/control.sock
      RE_MCP_OUT_DIR: /out
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 127.0.0.1
      MCP_PORT: ${MCP_PORT:-8765}

